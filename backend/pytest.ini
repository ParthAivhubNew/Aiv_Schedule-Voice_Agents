[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    db: needs a PostgreSQL test database (set TEST_DATABASE_URL)
    real_policy: exercises the real organisation-policy read even without a database (tenant_policy.org_effective)
    plan_check_on: keep the Workflows plan check on (test_workflows.py switches it off otherwise)
