<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outreach</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header id="top">
    <img src="icons/icon48.png" alt="" width="22" height="22">
    <strong>Outreach</strong>
  </header>
  <section id="page" aria-label="This page" hidden>
    <div class="pg-id">
      <span id="page-avatar" aria-hidden="true"></span>
      <div class="pg-text">
        <strong id="page-domain"></strong>
        <span id="page-line"></span>
      </div>
      <button type="button" id="page-clear" class="pg-x" aria-label="Dismiss this page">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>
    <form id="page-form">
      <label for="page-name">Company to look up</label>
      <div class="pg-row">
        <input id="page-name" maxlength="120" autocomplete="off">
        <button type="submit">Find in Leads</button>
      </div>
    </form>
  </section>
  <section id="company" aria-label="Company on this page" aria-live="polite" hidden></section>
  <nav id="tabs" role="tablist" aria-label="Outreach screens"></nav>
  <main id="stage">
    <div id="connect" hidden>
      <img src="icons/icon128.png" alt="" width="48" height="48">
      <h1 id="connect-title">Sign in to Outreach</h1>
      <p id="connect-text">Sign in to use Outreach on this page.</p>
      <button id="connect-button" type="button">Sign in</button>
      <p id="connect-error" role="alert"></p>
    </div>
    <div id="loading" role="status" hidden><span class="spin" aria-hidden="true"></span><span>Opening</span></div>
    <iframe id="frame" title="Outreach" allow="clipboard-write; microphone" referrerpolicy="origin" hidden></iframe>
  </main>
  <script src="sidepanel.js"></script>
</body>
</html>
