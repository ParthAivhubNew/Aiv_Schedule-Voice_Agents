# This server's port bindings. Only nginx (on this host) talks to the app: nothing is published to the internet directly.
services:
  postgres:
    ports: !override
      - "127.0.0.1:5432:5432"
  redis:
    ports: !override
      - "127.0.0.1:6379:6379"
  backend:
    ports: !override
      - "127.0.0.1:8000:8000"  # behind nginx; was 0.0.0.0, which let anyone skip HTTPS and nginx
  frontend:
    ports: !override
      - "127.0.0.1:8080:80"  # nginx proxies outreach.aivhub.com here
  livekit:
    ports: !override  # the backend reaches it inside Docker (ws://livekit:7880); nothing outside the server uses it
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
