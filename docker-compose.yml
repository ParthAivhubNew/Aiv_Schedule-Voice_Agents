version: '3.8'

services:
  # 1. PostgreSQL Database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aivhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aivhub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: aivhub_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aivhub_backend
    restart: unless-stopped
    # Lets the backend reach AI models running on this machine (Ollama, LM Studio, vLLM):
    # use http://host.docker.internal:<port> instead of localhost in Connections.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # .env.local is in git: Stripe TEST keys, so every developer can try payments.
    # .env comes second, so a server's own values win: production puts its live Stripe keys
    # (and any other variable from docs/SECURITY_SETUP.md not listed below) in .env.
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Europe/Berlin}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password_2026}@postgres:5432/${POSTGRES_DB:-aivhub}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-outreachAI_production_jwt_secret_key_change_me}
      # --- Telephony & Voice ---
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      TELNYX_API_KEY: ${TELNYX_API_KEY:-}
      TELNYX_PHONE_NUMBER: ${TELNYX_PHONE_NUMBER:-}
      TELNYX_ASSISTANT_ID: ${TELNYX_ASSISTANT_ID:-}
      TELNYX_ASSISTANT_PUBLIC_KEY: ${TELNYX_ASSISTANT_PUBLIC_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      CARTESIA_VOICE_ID: ${CARTESIA_VOICE_ID:-}

      # --- AI Providers & Explicit Models & URLs ---
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-dall-e-3}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com/v1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-grok-4.20-0309-non-reasoning}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.x.ai/v1}
      TELNYX_BASE_URL: ${TELNYX_BASE_URL:-https://api.telnyx.com/v2/ai}
      FAL_KEY: ${FAL_KEY:-}
      STABILITY_API_KEY: ${STABILITY_API_KEY:-}

      # --- Social APIs (LinkedIn, X, Facebook, Instagram) ---
      LINKEDIN_OAUTH_CLIENT_ID: ${LINKEDIN_OAUTH_CLIENT_ID:-}
      LINKEDIN_OAUTH_CLIENT_SECRET: ${LINKEDIN_OAUTH_CLIENT_SECRET:-}
      X_OAUTH_CLIENT_ID: ${X_OAUTH_CLIENT_ID:-}
      X_OAUTH_CLIENT_SECRET: ${X_OAUTH_CLIENT_SECRET:-}
      FACEBOOK_OAUTH_CLIENT_ID: ${FACEBOOK_OAUTH_CLIENT_ID:-}
      FACEBOOK_OAUTH_CLIENT_SECRET: ${FACEBOOK_OAUTH_CLIENT_SECRET:-}
      FACEBOOK_OAUTH_CONFIG_ID: ${FACEBOOK_OAUTH_CONFIG_ID:-}
      INSTAGRAM_OAUTH_CONFIG_ID: ${INSTAGRAM_OAUTH_CONFIG_ID:-}
      THREADS_OAUTH_CLIENT_ID: ${THREADS_OAUTH_CLIENT_ID:-}
      THREADS_OAUTH_CLIENT_SECRET: ${THREADS_OAUTH_CLIENT_SECRET:-}

      # --- Platform, Auth, & Search ---
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://outreach.aivhub.com}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret1234567890abcdef1234567890abcdef}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
      # Cal.com is optional - users can connect via UI settings (Cloud or self-hosted)
      # CALCOM_BASE_URL and CALCOM_API_KEY are configured through the admin panel
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "1"

  # 4. React Frontend (Served via Nginx on port 8080)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aivhub_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "1"

  # 5. LiveKit WebRTC SFU Server (Self-Hosted)
  livekit:
    image: livekit/livekit-server:latest
    container_name: aivhub_livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "1"

volumes:
  postgres_data:
