version: '3.8'

services:
  # 1. PostgreSQL Database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aivhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aivhub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: aivhub_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aivhub_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      TZ: ${TZ:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password_2026}@postgres:5432/${POSTGRES_DB:-aivhub}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-outreachAI_production_jwt_secret_key_change_me}
      VOICE_ENGINE_MODE: ${VOICE_ENGINE_MODE:-live}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      TELNYX_API_KEY: ${TELNYX_API_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://outreach.aivhub.com}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret1234567890abcdef1234567890abcdef}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      # Cal.com is optional - users can connect via UI settings (Cloud or self-hosted)
      # CALCOM_BASE_URL and CALCOM_API_KEY are configured through the admin panel
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "1"

  # 4. React Frontend (Served via Nginx on port 8080)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aivhub_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "1"

  # 5. LiveKit WebRTC SFU Server (Self-Hosted)
  livekit:
    image: livekit/livekit-server:latest
    container_name: aivhub_livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "1"

  # 6. SearXNG Local Meta-Search Engine (100% Open, Unlimited & Keyless)
  searxng:
    image: searxng/searxng:latest
    container_name: aivhub_searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "1"

volumes:
  postgres_data:
