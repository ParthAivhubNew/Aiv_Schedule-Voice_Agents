version: '3.8'

services:
  # 1. PostgreSQL Database (Multi-DB: aivhub + calcom)
  postgres:
    image: postgres:16-alpine
    container_name: aivhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aivhub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: aivhub_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Self-Hosted Cal.com Engine (Open Source AGPLv3)
  calcom:
    image: calcom/cal.com:latest
    container_name: aivhub_calcom
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password_2026}@postgres:5432/calcom
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password_2026}@postgres:5432/calcom
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-aivhub_calcom_jwt_secret_token_2026_xyz}
      CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY:-aivhub_calcom_encryption_key_32b_x}
      NEXT_PUBLIC_WEBAPP_URL: ${CALCOM_WEBAPP_URL:-https://3000-01m1bx2zfn0zxjnf9833v44pnv.cloudspaces.litng.ai}
      NEXTAUTH_URL: ${CALCOM_WEBAPP_URL:-https://3000-01m1bx2zfn0zxjnf9833v44pnv.cloudspaces.litng.ai}
      NEXT_PUBLIC_LICENSE_CONSENT: "agree"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

  # 4. FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aivhub_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password_2026}@postgres:5432/${POSTGRES_DB:-aivhub}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-aivhub_production_jwt_secret_key_change_me}
      CALCOM_BASE_URL: http://calcom:3000/api/v1
      CALCOM_API_KEY: ${CALCOM_API_KEY:-}
      CALCOM_EVENT_TYPE_ID: ${CALCOM_EVENT_TYPE_ID:-}
      VOICE_ENGINE_MODE: ${VOICE_ENGINE_MODE:-simulation}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  # 5. React Frontend (Served via Nginx on port 8080)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aivhub_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
