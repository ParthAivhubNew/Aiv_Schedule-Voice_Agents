# Logrotate configuration for Docker container logs
# Place this file at /etc/logrotate.d/docker-aivhub on your server
# This ensures logs older than 3 days are automatically deleted

/var/lib/docker/containers/*/*.log {
    rotate 0
    maxage 3
    missingok
    notifempty
    compress
    copytruncate
    size 500k
}
