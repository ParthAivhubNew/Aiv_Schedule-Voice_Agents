server {
    listen 80;
    server_name localhost;
    client_max_body_size 50m;

    # Static assets. Any app path (/voice/list, /scheduler/plan, ...) serves the single-page
    # app, which reads the path itself.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, so a new release is picked up at once.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # Staff admin portal: its own page for every /admin path (never the client app), not cached,
    # not indexed. Its API (/api/admin-api) accepts staff tokens only.
    location ~ ^/admin(/|$) {
        root /usr/share/nginx/html;
        try_files /admin.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow";
        add_header X-Frame-Options "DENY";
    }

    # Public AI images (Instagram / Threads fetch these)
    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Staff data-source file uploads: register files run to gigabytes, so no body-size cap here and
    # the body streams straight through to the backend (which writes it to disk and enforces its own
    # limit, DATA_IMPORT_MAX_GB). Everything else under /api/ keeps the 50m cap below.
    location ~ ^/api/admin-api/data-sources/[^/]+/files$ {
        proxy_pass http://backend:8000;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        client_max_body_size 50m;
    }

    # WebSocket reverse proxy
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Public legal pages served by the backend (Meta / Google app review link to these)
    location ~ ^/(privacy|privacy-policy|terms|terms-of-service|data-deletion)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://backend:8000/health;
    }
}
