# ==============================================================================
# LiveKit Server Configuration (Self-Hosted Docker)
# Official documentation: https://docs.livekit.io/home/self-hosting/deployment/
# ==============================================================================

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false

# Development API key and secret for WebRTC tokens & server authentication
keys:
  devkey: secret1234567890abcdef1234567890abcdef

logging:
  json: false
  level: info
